[package]
name = "vibeterm"
version = "0.1.25"
edition = "2021"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
arboard = "3"
base64 = "0.22"
fontdb = "0.23"
iced = { version = "0.13", features = ["advanced", "canvas", "wgpu", "tokio"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
