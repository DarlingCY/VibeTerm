[package]
name = "vibeterm"
version = "0.1.15"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
arboard = "3"
base64 = "0.22"
fontdb = "0.23"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
ureq = { version = "2.12", features = ["json"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
