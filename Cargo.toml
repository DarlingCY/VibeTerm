[package]
name = "vibeterm"
version = "0.1.2"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
eframe = "0.31"
egui = "0.31"
egui_term = { path = "vendor/egui_term" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
winres = "0.1"
