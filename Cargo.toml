[package]
name = "vibeterm"
version = "0.1.9"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
arboard = "3"
base64 = "0.22"
fontdb = "0.23"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.34.8"
ureq = { version = "2.12", features = ["json"] }
wry = "0.54.4"

[build-dependencies]
winres = "0.1"
